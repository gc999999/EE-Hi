<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>電機系學程島｜電機海起來</title>
  <meta name="description" content="電機系學程島：電磁學、通訊工程、電子學三座島，系主任 PUMA 帶你走一遍電機系四年的學習路線。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scene-wrap" id="scene">
    <svg id="scene-svg" viewBox="0 0 1440 810" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="電機系學程島場景：三座課程島嶼與中央廣場"></svg>
  </div>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="panel-close" id="panel-close" aria-label="關閉面板">✕</button>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="overlay-kicker">EE LEARNING ISLAND</div>
      <h1 class="overlay-title">電機系學程島</h1>
      <div class="overlay-slogan">電機海起來</div>
      <p class="overlay-desc">
        三座島、三門核心課、一位系主任 PUMA。<br>
        點點島上的學生與島嶼，走一遍電機系四年的學習路線。
      </p>
      <button class="overlay-btn" id="overlay-btn">開始海起來</button>
    </div>
  </div>

  <footer class="brand">EE LEARNING ISLAND · 電機系學程島</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
